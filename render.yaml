services:
  - type: web
    name: gtm-intel-api
    runtime: docker
    region: oregon
    plan: starter           # $7/mo always-on; use "free" to avoid cost (cold starts)

    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BRIGHT_DATA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RESEND_FROM
        sync: false

services:
  - type: web
    name: gtm-intel-api
    runtime: python
    region: oregon          # change to "frankfurt" for EU

    # python version is controlled by runtime.txt (python-3.11.9)
    # plan: free            # free but sleeps after 15 min of inactivity
    plan: starter           # $7/mo — always-on, no cold starts

    buildCommand: >-
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm || true

    startCommand: uvicorn stage6.backend.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BRIGHT_DATA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

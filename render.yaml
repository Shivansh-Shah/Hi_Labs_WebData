services:
  - type: web
    name: gtm-intel-api
    runtime: docker
    region: oregon          # change to "frankfurt" for EU
    plan: starter           # $7/mo — always-on; use "free" if you don't mind cold starts

    dockerfilePath: ./Dockerfile   # relative to repo root

    healthCheckPath: /health

    # All sync:false values must be entered manually in Render dashboard → Environment
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BRIGHT_DATA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # set AFTER Vercel deploy: https://your-app.vercel.app

[build]
builder = "nixpacks"
# Install all Python deps including spaCy language model
buildCommand = "pip install -r requirements.txt && python -m spacy download en_core_web_sm || true"

[deploy]
startCommand = "uvicorn stage6.backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
